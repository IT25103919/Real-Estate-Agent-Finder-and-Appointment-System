<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Availability</title>

  <style>

    body{
      font-family: Arial;
      background:#f4f4f4;
      padding:40px;
    }

    .container{
      width:400px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:12px;
      background:#007bff;
      color:white;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>Add Available Time</h2>

  <form id="availabilityForm">

    <input type="text"
           id="agentId"
           placeholder="Agent ID"
           required>

    <input type="date"
           id="date"
           required>

    <input type="time"
           id="time"
           required>

    <button type="submit">
      Add Availability
    </button>

  </form>

</div>

<script>

  document.getElementById("availabilityForm")
          .addEventListener("submit", async function(e){

            e.preventDefault();

            const availability = {

              agentId:
              document.getElementById("agentId").value,

              date:
              document.getElementById("date").value,

              time:
              document.getElementById("time").value
            };

            await fetch(
                    "http://localhost:8080/availability",
                    {
                      method:"POST",

                      headers:{
                        "Content-Type":"application/json"
                      },

                      body:JSON.stringify(availability)
                    }
            );

            alert("Availability Added Successfully");

          });

</script>

</body>
</html>
