<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Virtual Appointment Booking</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .container{
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input,
        textarea{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button{
            background: #007bff;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Book Virtual Appointment</h2>

    <form id="appointmentForm">

        <input type="text"
               id="clientId"
               placeholder="Client ID"
               required>

        <input type="text"
               id="agentId"
               placeholder="Agent ID"
               required>

        <input type="date"
               id="date"
               required>

        <input type="time"
               id="time"
               required>

        <textarea id="notes"
                  placeholder="Notes"></textarea>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</div>

<script>

    document.getElementById("appointmentForm")
        .addEventListener("submit", async function(e){

            e.preventDefault();

            const appointment = {

                clientId:
                document.getElementById("clientId").value,

                agentId:
                document.getElementById("agentId").value,

                date:
                document.getElementById("date").value,

                time:
                document.getElementById("time").value,

                notes:
                document.getElementById("notes").value
            };

            const response = await fetch(
                "http://localhost:8080/appointments",
                {
                    method: "POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body: JSON.stringify(appointment)
                }
            );

            if(response.ok){

                alert("Appointment Booked Successfully");

                document.getElementById("appointmentForm").reset();
            }
            else{

                alert("Booking Failed");
            }

        });

</script>

</body>
</html>
