<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Elite Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            padding: 20px;
        }

        .signup-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #2b6cb0;
            box-shadow: 0 10px 30px rgba(43, 108, 176, 0.1);
            width: 100%;
            max-width: 600px; /* Fields wadi nisa tikak loku kala */
            text-align: center;
        }

        h2 { color: #2b6cb0; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: #718096; margin-bottom: 30px; font-size: 14px; }

        /* Role Selection Styling */
        .role-container {
            margin-bottom: 25px;
            text-align: left;
        }
        .role-label {
            font-size: 14px; font-weight: 600; color: #4a5568; margin-bottom: 10px; display: block;
        }
        .role-selection {
            display: flex;
            gap: 15px;
        }
        .role-option { flex: 1; position: relative; }
        .role-option input[type="radio"] { display: none; }
        .role-option label {
            display: block;
            padding: 12px;
            background: #f7fafc;
            border: 2px solid #edf2f7;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s;
            text-align: center;
        }
        .role-option input[type="radio"]:checked + label {
            border-color: #2b6cb0;
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Side by side danna */
            gap: 20px;
            text-align: left;
        }

        /* Mobile waladi 1 column wenna */
        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .input-group { margin-bottom: 5px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 5px; }

        input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #cbd5e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.3s;
        }

        input:focus { outline: none; border-color: #2b6cb0; }

        button {
            width: 100%;
            padding: 16px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.3s;
        }

        button:hover { background-color: #2c5282; }

        #message { margin-top: 20px; font-size: 14px; }
        .error { color: #e53e3e; }
        .success { color: #38a169; }

        .login-link { margin-top: 20px; font-size: 14px; color: #718096; }
        .login-link a { color: #2b6cb0; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="signup-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join our real estate community today</p>

    <!-- Role Selection -->
    <div class="role-container">
        <span class="role-label">I am a:</span>
        <div class="role-selection">
            <div class="role-option">
                <input type="radio" id="client" name="role" value="CLIENT" checked>
                <label for="client">Client / Buyer</label>
            </div>
            <div class="role-option">
                <input type="radio" id="agent" name="role" value="AGENT">
                <label for="agent">Real Estate Agent</label>
            </div>
        </div>
    </div>

    <!-- Input Fields Grid -->
    <div class="form-grid">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="John Doe">
        </div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="johnny99">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
    </div>

    <button onclick="doSignUp()">Create Account</button>

    <div id="message"></div>

    <p class="login-link">
        Already have an account? <a href="login.html">Login</a>
    </p>
</div>

<script>
    async function doSignUp() {
        const fullName = document.getElementById('fullName').value;
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.querySelector('input[name="role"]:checked').value;

        const msgDiv = document.getElementById('message');

        if (!fullName || !username || !email || !password) {
            msgDiv.innerHTML = '<span class="error">Please fill in all fields.</span>';
            return;
        }

        const signupData = {
            name: fullName,
            username: username,
            email: email,
            password: password,
            role: role
        };

        try {
            const response = await fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(signupData)
            });

            const data = await response.json();

            if (data.status === 'success') {
                msgDiv.innerHTML = '<span class="success">Registration successful! Please login.</span>';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                msgDiv.innerHTML = `<span class="error">${data.message}</span>`;
            }
        } catch (err) {
            msgDiv.innerHTML = '<span class="error">Connection failed. Check your server.</span>';
        }
    }
</script>

</body>
</html>
