<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstateHub - Welcome</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* ONLY LOGO IMPROVED */
        .logo {
            position: absolute;
            top: 28px;
            left: 40px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #c9a84c, #f2d27b);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .logo-box span {
            font-size: 26px;
            font-weight: 700;
            color: #0f1f3d;
            font-family: 'DM Serif Display', serif;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text h2 {
            color: white;
            font-size: 30px;
            font-family: 'DM Serif Display', serif;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
        }

        .logo-text p {
            color: #d9b75d;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 31, 61, 0.5);
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        .content {
            position: relative;
            z-index: 20;
            color: white;
            padding: 20px;
        }

        .content h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 64px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
            transform: translateY(30px);
            opacity: 0;
            transition: all 1s ease 0.5s;
        }

        .content p {
            font-size: 20px;
            margin-bottom: 40px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
            transform: translateY(30px);
            opacity: 0;
            transition: all 1s ease 0.7s;
        }

        .slide.active .content h1,
        .slide.active .content p {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-login {
            position: relative;
            z-index: 20;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #0f1f3d;
            background-color: #c9a84c;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transform: translateY(30px);
            opacity: 0;
            transition: all 1s ease 0.9s;
        }

        .slide.active .btn-login {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-login:hover {
            background-color: #e8c97a;
            transform: translateY(-3px) scale(1.02) !important;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

<!-- BEAUTIFUL LOGO ONLY -->
<div class="logo">
    <div class="logo-box">
        <span>EH</span>
    </div>

    <div class="logo-text">
        <h2>EstateHub</h2>
        <p>Luxury Real Estate</p>
    </div>
</div>

<div class="slider-container" id="slider"></div>

<script>
    const slidesData = [
        {
            image: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80',
            title: 'Find Your Dream Home',
            desc: 'Discover luxury properties tailored to your lifestyle.'
        },
        {
            image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80',
            title: 'Modern Architecture',
            desc: 'Experience the best of contemporary real estate and design.'
        },
        {
            image: 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1920&q=80',
            title: 'Exclusive Neighborhoods',
            desc: 'Premium locations for you and your family to thrive.'
        }
    ];

    const slider = document.getElementById('slider');

    slidesData.forEach((slide, index) => {
        const slideDiv = document.createElement('div');

        slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;

        slideDiv.style.backgroundImage = `url(${slide.image})`;

        slideDiv.innerHTML = `
            <div class="content">
                <h1>${slide.title}</h1>
                <p>${slide.desc}</p>
                <a href="login.html" class="btn-login">
                    Login to Portal ➔
                </a>
            </div>
        `;

        slider.appendChild(slideDiv);
    });

    let currentSlide = 0;

    const slideElements = document.querySelectorAll('.slide');

    setInterval(() => {

        slideElements[currentSlide].classList.remove('active');

        currentSlide =
            (currentSlide + 1) % slideElements.length;

        slideElements[currentSlide].classList.add('active');

    }, 5000);
</script>

</body>
</html>
