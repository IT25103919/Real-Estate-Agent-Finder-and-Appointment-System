<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EstateHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(to right, rgba(15, 31, 61, 0.85) 0%, rgba(43, 108, 176, 0.4) 100%),
                        url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex; align-items: center; justify-content: center;
        }
        .page-wrapper { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; padding: 0 40px; gap: 50px; }
        .left-content { flex: 1; color: #ffffff; max-width: 500px; }
        .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
        .logo-box { width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, #c9a84c, #f2d27b); display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.15); }
        .logo-box span { font-size: 26px; font-weight: 700; color: #0f1f3d; font-family: 'DM Serif Display', serif; }
        .logo-text h2 { color: white; font-size: 32px; font-family: 'DM Serif Display', serif; letter-spacing: 1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.4); }
        .logo-text p { color: #d9b75d; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
        .left-content h1 { font-family: 'DM Serif Display', serif; font-size: 54px; line-height: 1.1; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .left-content p { font-size: 16px; line-height: 1.6; color: #e2e8f0; margin-bottom: 10px; }
        .login-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 45px 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .login-card h2 { color: #2b6cb0; font-size: 26px; font-weight: 700; margin-bottom: 25px; text-align: center; }
        .role-selection { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        .role-option { flex: 1; position: relative; }
        .role-option input[type="radio"] { display: none; }
        .role-option label { display: block; padding: 10px 5px; background: #f7fafc; border: 2px solid #edf2f7; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: #4a5568; transition: all 0.2s; text-align: center; }
        .role-option input[type="radio"]:checked + label { border-color: #2b6cb0; background-color: #ebf8ff; color: #2b6cb0; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 14px 16px; border: 1.5px solid #cbd5e0; border-radius: 10px; font-size: 15px; color: #2d3748; outline: none; transition: 0.3s; background: #ffffff; }
        input:focus { border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,0.1); }
        .forgot-pass { display: block; text-align: right; font-size: 12px; color: #2b6cb0; text-decoration: none; font-weight: 600; margin-top: -10px; margin-bottom: 20px; }
        .forgot-pass:hover { text-decoration: underline; }
        button.btn-submit { width: 100%; padding: 15px; background-color: #2b6cb0; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(43,108,176,0.3); }
        button.btn-submit:hover { background-color: #2c5282; transform: translateY(-2px); }
        #message { margin-top: 15px; font-size: 14px; text-align: center; }
        .error { color: #e53e3e; font-weight: 500; }
        .success { color: #38a169; font-weight: 500; }
        .signup-link { margin-top: 25px; font-size: 14px; color: #718096; text-align: center; }
        .signup-link a { color: #2b6cb0; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }
        @media (max-width: 900px) {
            .page-wrapper { flex-direction: column; justify-content: center; gap: 30px; text-align: center; padding: 20px; }
            .left-content { max-width: 100%; }
            .logo { justify-content: center; }
            .left-content h1 { font-size: 42px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="left-content">
        <div class="logo">
            <div class="logo-box"><span>EH</span></div>
            <div class="logo-text"><h2>EstateHub</h2><p>Luxury Real Estate</p></div>
        </div>
        <h1>EXPLORE<br>PROPERTIES</h1>
        <p>Where Your Dream Destinations Become Reality.</p>
    </div>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <div class="role-selection">
            <div class="role-option">
                <input type="radio" id="client" name="role" value="CLIENT" checked>
                <label for="client">Client</label>
            </div>
            <div class="role-option">
                <input type="radio" id="agent" name="role" value="AGENT">
                <label for="agent">Agent</label>
            </div>
            <div class="role-option">
                <input type="radio" id="admin" name="role" value="ADMIN">
                <label for="admin">Admin</label>
            </div>
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••••••">
        </div>
        <a href="#" class="forgot-pass">Forgot password?</a>
        <button class="btn-submit" onclick="doLogin()">SIGN IN</button>
        <div id="message"></div>
        <div class="signup-link">Are you new? <a href="signup.html">Create an Account</a></div>
    </div>
</div>

<script>
    async function doLogin() {
        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role     = document.querySelector('input[name="role"]:checked').value;
        const msgDiv   = document.getElementById('message');

        if (!email || !password) {
            msgDiv.innerHTML = '<span class="error">Please fill in all fields.</span>';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role })
            });

            const data = await response.json();

            if (data.status === 'success') {
                // FIX: AuthController now returns data.id in the response.
                // Previously data.id was undefined because the backend never sent it.
                localStorage.setItem('userId',   data.id);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userName', data.name);

                msgDiv.innerHTML = '<span class="success">✅ Login successful!</span>';

                setTimeout(() => {
                    if (data.role === 'ADMIN') {
                        window.location.href = 'Admindashboard.html';
                    } else if (data.role === 'AGENT') {
                        window.location.href = 'agent-dashboard.html';
                    } else {

                        const redirect = localStorage.getItem('redirectAfterLogin');
                        localStorage.removeItem('redirectAfterLogin'); // clear it after use
                        window.location.href = redirect || 'client-dashboard.html';
                    }
                }, 1000);
            } else {
                msgDiv.innerHTML = `<span class="error">❌ ${data.message}</span>`;
            }
        } catch (err) {
            msgDiv.innerHTML = '<span class="error">❌ Server error! Check backend connection.</span>';
        }
    }
</script>
</body>
</html>
